<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Zapojenie ESP32 a STM32F303K8</title>
  <rect width="860" height="440" fill="#ffffff"/>

  <!-- step-down -->
  <rect x="330" y="20" width="200" height="60" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
  <text x="430" y="45" text-anchor="middle" font-weight="700">Step-down XL4015</text>
  <text x="430" y="66" text-anchor="middle" fill="#444">LiPo → 5 V</text>

  <!-- ESP32 -->
  <rect x="40" y="120" width="230" height="270" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
  <text x="155" y="148" text-anchor="middle" font-weight="700" font-size="16">ESP32 DevKit</text>
  <text x="155" y="168" text-anchor="middle" fill="#444" font-size="12">(ESP32-WROOM-32)</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="258" y="215" text-anchor="end">VIN</text>
    <text x="258" y="265" text-anchor="end">GPIO17 / TX2</text>
    <text x="258" y="315" text-anchor="end">GPIO16 / RX2</text>
    <text x="258" y="365" text-anchor="end">GND</text>
  </g>
  <circle cx="270" cy="210" r="5" fill="#000"/>
  <circle cx="270" cy="260" r="5" fill="#000"/>
  <circle cx="270" cy="310" r="5" fill="#000"/>
  <circle cx="270" cy="360" r="5" fill="#000"/>

  <!-- STM32 -->
  <rect x="590" y="120" width="230" height="270" fill="#f4f4f4" stroke="#000" stroke-width="2"/>
  <text x="705" y="148" text-anchor="middle" font-weight="700" font-size="16">STM32F303K8</text>
  <text x="705" y="168" text-anchor="middle" fill="#444" font-size="12">(Nucleo-32)</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="602" y="215">5V</text>
    <text x="602" y="265">PA10 / RX (D0)</text>
    <text x="602" y="315">PA9  / TX (D1)</text>
    <text x="602" y="365">GND</text>
  </g>
  <circle cx="590" cy="210" r="5" fill="#000"/>
  <circle cx="590" cy="260" r="5" fill="#000"/>
  <circle cx="590" cy="310" r="5" fill="#000"/>
  <circle cx="590" cy="360" r="5" fill="#000"/>

  <!-- napajanie 5 V -->
  <g stroke="#c42b1c" stroke-width="3" fill="none">
    <polyline points="380,80 380,210 270,210"/>
    <polyline points="480,80 480,210 590,210"/>
  </g>
  <text x="325" y="202" text-anchor="middle" fill="#c42b1c" font-weight="700">5 V</text>
  <text x="535" y="202" text-anchor="middle" fill="#c42b1c" font-weight="700">5 V</text>

  <!-- data: ESP TX -> STM RX -->
  <line x1="270" y1="260" x2="590" y2="260" stroke="#0078d7" stroke-width="3"/>
  <polygon points="560,253 576,260 560,267" fill="#0078d7"/>
  <text x="430" y="252" text-anchor="middle" fill="#0078d7" font-weight="700">ovládanie (ESP → STM)</text>

  <!-- data: STM TX -> ESP RX -->
  <line x1="590" y1="310" x2="270" y2="310" stroke="#107c10" stroke-width="3"/>
  <polygon points="300,303 284,310 300,317" fill="#107c10"/>
  <text x="430" y="302" text-anchor="middle" fill="#107c10" font-weight="700">telemetria (STM → ESP)</text>

  <!-- GND -->
  <line x1="270" y1="360" x2="590" y2="360" stroke="#000" stroke-width="3"/>
  <text x="430" y="352" text-anchor="middle" font-weight="700">GND – spoločná zem</text>

  <text x="430" y="420" text-anchor="middle" fill="#444" font-size="13">UART 115200 8N1 · logika 3,3 V na oboch stranách · TX ↔ RX do kríža</text>
</svg>
